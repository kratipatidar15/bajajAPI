[build]
  base = "."
  functions = "netlify/functions"
  publish = "public"
[dev]
  port = 8888

[[redirects]]
  from = "/bfhl"
  to = "/.netlify/functions/bfhl"
  status = 200
  force = true

[[redirects]]
  from = "/health"
  to = "/.netlify/functions/bfhl"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

